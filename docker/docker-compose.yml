name: qa-system

services:
  # ===== 关系型元数据库 =====
  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    restart: unless-stopped
    # max_connections=200：覆盖 PG 默认 100，给后端连接池（5/10 → 20/10）留余量，
    # 以及 alembic migration 临时连接、admin 页面等额外占用。
    # max_connections 必须重启 PG 才能生效（reload 不行），数据保留。
    # 改回 100：删掉 command 行后 `docker compose up -d postgres` 即可。
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: qa_metadata
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"  # 避开宿主 5432（被 openmetadata 占用）；容器内仍是 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_metadata"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 本体图数据库 =====
  neo4j:
    image: neo4j:5.23-community
    container_name: qa-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ===== Milvus 向量库依赖 =====
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: qa-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: qa-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.4.6
    container_name: qa-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # metrics
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===== 知识源文件对象存储（独立于 milvus-minio） =====
  qa-objects:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: qa-objects
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须显式配置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须显式配置}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objects_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== Demo 业务库（WMS） =====
  mysql-demo:
    image: mysql:8.0
    container_name: qa-mysql-demo
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wms_demo
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== FastAPI 后端 =====
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: qa-backend
    restart: unless-stopped
    volumes:
      # PDF 中文字体（2026-10-31）：微软雅黑不可再分发，**不入 git**，由运维把
      # msyh.ttc / msyhbd.ttc 放进 docker/fonts/（目录本身随仓库存在，见其 README）。
      # 缺文件时导出回落 STSong-Light，不会失败；只是阅读器可能显示方框。
      - ./fonts:/app/fonts:ro
    # 容器内配置全部从 docker/.env 注入（SSOT：容器内端口用容器 service 名 + 容器端口）。
    # 本地 dev（容器外跑 uvicorn）用 backend/.env，端口用 localhost:5433（因宿主端口重映射）。
    # 端口契约详见 Harness/wiki/operations-runbook.md「SSOT 端口契约」段。
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: qa-objects:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须显式配置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须显式配置}
    extra_hosts:
      # 容器内访问宿主机（host.docker.internal）；Linux Docker 需显式 host-gateway，
      # macOS/Windows Docker Desktop 自动解析，此映射兼容两者。
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy

  # ===== 通用 Agent 编排 Worker（opt-in，默认**不**启动）=====
  # 灰度开关 = profiles：默认 `docker compose up -d` 完全看不到它，只有显式
  #   docker compose --profile agent-orchestration up -d agent-orchestration-worker
  # 才会拉起。CentOS 生产用同一份定义（overlay 合并继承），不需要改生产文件。
  #
  # 硬约束（勿改）：
  #   - 不发布宿主端口：Worker 只出站访问 DB / LLM，不对外提供服务；
  #   - 不得被 backend / frontend 通过 depends_on 拉起 —— API 侧永不自动起 Worker；
  #   - ENABLE_AGENT_ORCHESTRATION=true 只写在这里（Worker 侧）；
  #     backend 侧的 flag 仍由 docker/.env 控制 ⇒ 默认不暴露编排路由（默认下线）；
  #   - 与 backend 同源构建（同一 Dockerfile + 同一 build context），**不写 image: 键**
  #     —— 与 backend / frontend 同为「本地 build 的服务」，compose 里带 image: 的
  #     一律是外部镜像（build_offline_images.py 的 IMAGES 清单按这个约定维护）。
  #     镜像名由 compose 自动派生（qa-system-agent-orchestration-worker，
  #     跨 compose 版本可能是下划线），离线部署时以目标机
  #     `docker compose --profile agent-orchestration config --images` 的输出为准。
  agent-orchestration-worker:
    profiles:
      - agent-orchestration
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: qa-agent-orchestration-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 env_file 里的同名变量（compose 里 environment 优先于 env_file）。
      # flag 关闭时 Worker 会直接返回不轮询 —— 所以这里必须显式打开。
      ENABLE_AGENT_ORCHESTRATION: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 覆盖镜像默认 CMD（默认是 alembic upgrade head && uvicorn）：
    # Worker 是纯轮询进程，不跑迁移（迁移由 backend 容器负责），也不监听端口。
    command: ["python", "-m", "app.workers.agent_orchestration_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy

  # ===== React 前端 =====
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      # 必须把 VITE_API_BASE_URL 传进 build 阶段：Dockerfile 用 ARG 接收默认值，
      # 仅在 runtime environment 声明是无效的（Vite 把 import.meta.env 在 build 时
      # 固化进 bundle，runtime 改不了）。
      # 默认 docker/.env 写的是 http://localhost:5173/api/v1（走 nginx 反代同源，
      # 对 192.168.x.x / 10.x.x.x LAN IP 也安全 —— 同源策略自动放行）。
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5173/api/v1}
    container_name: qa-frontend
    restart: unless-stopped
    # 不设 VITE_API_BASE_URL 环境变量：Vite 是编译期注入，运行时环境变量对
    # 静态 bundle 毫无作用，只会误导（部署与访问规范 §一；2026-09-21 清理）。
    # API 基地址在 Dockerfile ARG 控制，默认空 = 同源相对路径 /api/v1。
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
  neo4j_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  mysql_data:
  objects_data:
