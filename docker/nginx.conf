server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小上限：覆盖 nginx 默认 1m（详见 https://nginx.org/en/docs/http/ngx_http_core_module.html#client_max_body_size）
    # 文档中心 RAG 上传（PDF/DOCX/TXT/MD）典型 1-20MB，100m 留 5x 余量；
    # 大文件走流式（proxy_buffering off）避免 100m 一次性占内存。
    client_max_body_size 100m;

    # index.html 禁缓存：带 hash 的 assets 可长缓存，但入口 HTML 必须
    # no-cache，否则浏览器启发式缓存旧 index.html → 一直加载旧 bundle，
    # 前端「已修复但用户永远看不到」（2026-09-18 报障复盘）。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源：内容不变 hash 变，可放心长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker 内置 DNS。**必须配合下面的变量写法**：proxy_pass 里写死主机名时，
    # nginx 只在**启动时解析一次**并缓存 IP；而后端容器一旦被重建
    # （`docker compose up -d backend` / `--force-recreate`，每次镜像重建部署都会发生）
    # 就会拿到**新 IP**，nginx 仍指向旧 IP → 所有 /api/ 502。
    # 后果很隐蔽：前端 fetchMenuConfig 抛错后**静默**退回 FALLBACK_NAV，
    # 表现为「菜单少了、没有分组」，而不是报错。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 反向代理（可选，生产可让前端直连后端）
    location /api/ {
        # 用变量让 nginx 按 resolver 周期重新解析，而不是启动时钉死。
        # （变量形式不带 URI 部分，请求 URI 原样透传，与原先行为一致。）
        set $backendUpstream backend:8000;
        proxy_pass http://$backendUpstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传流式转发（避免 nginx 把整个 body 缓存到磁盘再转给后端）
        proxy_buffering off;
        proxy_request_buffering off;
        # 大文件解析耗时较长，放宽代理超时（默认 60s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
