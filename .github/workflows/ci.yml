name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / typecheck + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm exec -- tsc -b
      - name: Test with 80% coverage gates
        run: npm run test:coverage

  backend-unit:
    name: Backend / unit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # 单分片实测最坏 14.1 分钟（shard 3，**本地 5 进程并行抢同一个 PG** 的保守值，
    # CI 里 4 个分片各占一台 runner、各用一个独立库 ⇒ 不会互相拖慢）。
    # 加上 CI 侧 setup（uv sync + alembic upgrade head + pytest 启动）约 4 分钟
    # ⇒ 最坏 ~19 分钟；上限给到 40 分钟 ⇒ **余量 2.2 倍**（旧配置只有 1.07 倍）。
    # 旧配置是「整个套件塞一个 job + 45 分钟上限」，而基线就要 42 分钟 ⇒ 余量仅 7%
    # ⇒ runner 抖动 10% 就判 cancelled；而 cancelled 的 job 失败集合是**空的**
    # ⇒ 「失败集合对差」会得出「净新增 0」的**假结论**。
    timeout-minutes: 40
    strategy:
      # 必须 fail-fast: false：一个分片失败若取消其余分片，被取消分片的失败集合
      # 同样是空的 ⇒ 又一次假「净新增 0」。
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qa_metadata_test
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_metadata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      TEST_DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Run unit shard
        # 不做任何 deselect：本地实测（2026-10-30）main @ 1b9f4f71 上
        # test_refine_shortcuts 已 59/59 全绿（旧「28 红基线」已过时，不得据此豁免）；
        # 另有 14 条在 main 上即红的既有失败（test_chat_service 4 / stream 2 /
        # datasource_pool 2 / dependencies 1 / intent_classify_order 1 /
        # no_sqlite_fallback 1 / rate_limit 3）—— CI 首跑会如实暴露，
        # 修复属独立批次，不用 deselect 掩盖（防假绿）。
        #
        # 分片用**路径稳定哈希**（app/utils/ci_shard.py），不用「排序后下标 mod N」：
        # 后者增删一个文件会让其后所有文件的分片归属整体轮转一位
        # （Harness/rules/测试规范.md 记录 integration/ 因此爆过两次）。
        shell: bash
        env:
          # 走 env 而不是把 ${{ matrix.shard }} 直接插进脚本正文：
          # GH Actions 会先把 ${{ }} 展开成**脚本文本**再交给 bash 解析，
          # 将来矩阵若改成动态来源（fromJSON(needs...)），插值就成了注入面。
          SHARD: ${{ matrix.shard }}
        run: |
          # ⚠️ 用命令替换而不是进程替换：进程替换的退出码会被 mapfile 吞掉
          # （mapfile 恒返回 0），分片生成器一失败就变成「空数组」。
          # 空数组喂给 pytest = 「不带任何路径参数」⇒ pytest 回落到
          # testpaths=["app/tests"] ⇒ **整个 unit+integration+e2e 套件被收进来**
          # ⇒ 本 job 没有 neo4j/milvus 服务 ⇒ 报错并超时 ⇒ job 变 cancelled
          # ⇒ 失败集合为空 ⇒ 又一次假「净新增 0」。
          shard_list=$(uv run python -m app.utils.ci_shard \
            --root app/tests/unit --shards 4 --shard "$SHARD") || {
              echo "::error::分片清单生成失败（shard=$SHARD）"
              exit 1
            }
          if [ -z "$shard_list" ]; then
            echo "::error::shard=$SHARD 分到 0 个测试文件 —— 拒绝执行 pytest（空参数会让 pytest 收集整个 app/tests 树）"
            exit 1
          fi
          mapfile -t shard_tests <<< "$shard_list"
          printf 'Shard %s: %d test files\n' "$SHARD" "${#shard_tests[@]}"
          # pytest 失败也要走完下面的标记：`|| status=$?` 在 `set -e` 下不会触发 errexit。
          status=0
          uv run pytest "${shard_tests[@]}" -q -p no:randomly || status=$?
          # 完成标记：**日志里缺这个标记 ⇒ 该 job 是在跑完前被取消的**
          # ⇒ 它的失败集合是空的，不能参与「失败集合对差」，必须复跑该 job。
          # 标记里带 status：status=0 ⇒ 真绿；status!=0 ⇒ 真红（失败集合可用）。
          echo "UNIT_SHARD_DONE shard=$SHARD status=$status"
          exit "$status"

  backend-integration:
    name: Backend / integration shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qa_metadata_test
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_metadata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.23-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-only
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7688:7687
        options: >-
          --health-cmd "wget -O /dev/null -q http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      TEST_DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      TEST_NEO4J_URI: bolt://127.0.0.1:7688
      NEO4J_PASSWORD: ci-neo4j-only
      MILVUS_URI: http://127.0.0.1:19530
      MILVUS_TEST_DB_NAME: qa_ci
      MINIO_ROOT_USER: ci-minio-only
      MINIO_ROOT_PASSWORD: ci-minio-password-only
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Milvus
        # 覆盖 job 级 working-directory: backend —— compose 文件在仓库根 docker/ 下。
        # minio/minio 的 Docker Hub 官方镜像已下架（MinIO 2025 年中迁出，dockerproxy
        # 等镜像代理也无此 tag 缓存）——CI 改从 ghcr.io/sunql/qa-ci-minio（本仓库
        # 自托管、public，digest=sha256:b36662dc5313，与原 Docker Hub amd64 镜像
        # 逐字节同源）预拉，再 retag 成 compose 期望的 minio/minio 名字；prod compose
        # 文件因此零改动。其余两镜像按 tag 直接预拉；任何一步失败完整暴露报错，
        # 不做掩盖。
        working-directory: .
        run: |
          docker pull ghcr.io/sunql/qa-ci-minio:RELEASE.2023-03-20T20-16-18Z
          docker tag ghcr.io/sunql/qa-ci-minio:RELEASE.2023-03-20T20-16-18Z \
            minio/minio:RELEASE.2023-03-20T20-16-18Z
          for img in \
            quay.io/coreos/etcd:v3.5.5 \
            milvusdb/milvus:v2.4.6; do
            ok=""
            for i in 1 2 3 4; do
              if docker pull "$img"; then ok=1; break; fi
              echo "pull $img 第 $i 次失败，30s 后重试"
              sleep 30
            done
            if [ -z "$ok" ]; then
              echo "::error::docker pull $img 重试 4 次仍失败（限流或 tag 已被上游清理）"
              exit 1
            fi
          done
          docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 240 milvus-standalone
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Run integration shard
        shell: bash
        run: |
          mapfile -t all_tests < <(find app/tests/integration -name 'test_*.py' -print | sort)
          shard_tests=()
          for ((i=${{ matrix.shard }}; i<${#all_tests[@]}; i+=4)); do
            shard_tests+=("${all_tests[$i]}")
          done
          printf 'Shard ${{ matrix.shard }}: %d test files\n' "${#shard_tests[@]}"
          uv run pytest "${shard_tests[@]}" -q -p no:randomly
