name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / typecheck + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm exec -- tsc -b
      - name: Test with 80% coverage gates
        run: npm run test:coverage

  backend-unit:
    name: Backend / unit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # 单分片实测最坏 14.1 分钟（shard 3，**本地 5 进程并行抢同一个 PG** 的保守值，
    # CI 里 4 个分片各占一台 runner、各用一个独立库 ⇒ 不会互相拖慢）。
    # 加上 CI 侧 setup（uv sync + alembic upgrade head + pytest 启动）约 4 分钟
    # ⇒ 最坏 ~19 分钟；上限给到 40 分钟 ⇒ **余量 2.2 倍**（旧配置只有 1.07 倍）。
    # 旧配置是「整个套件塞一个 job + 45 分钟上限」，而基线就要 42 分钟 ⇒ 余量仅 7%
    # ⇒ runner 抖动 10% 就判 cancelled；而 cancelled 的 job 失败集合是**空的**
    # ⇒ 「失败集合对差」会得出「净新增 0」的**假结论**。
    timeout-minutes: 40
    strategy:
      # 必须 fail-fast: false：一个分片失败若取消其余分片，被取消分片的失败集合
      # 同样是空的 ⇒ 又一次假「净新增 0」。
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qa_metadata_test
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_metadata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      TEST_DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Run unit shard
        # 不做任何 deselect：本地实测（2026-10-30）main @ 1b9f4f71 上
        # test_refine_shortcuts 已 59/59 全绿（旧「28 红基线」已过时，不得据此豁免）；
        # 另有 14 条在 main 上即红的既有失败（test_chat_service 4 / stream 2 /
        # datasource_pool 2 / dependencies 1 / intent_classify_order 1 /
        # no_sqlite_fallback 1 / rate_limit 3）—— CI 首跑会如实暴露，
        # 修复属独立批次，不用 deselect 掩盖（防假绿）。
        #
        # 分片用**路径稳定哈希**（app/utils/ci_shard.py），不用「排序后下标 mod N」：
        # 后者增删一个文件会让其后所有文件的分片归属整体轮转一位
        # （Harness/rules/测试规范.md 记录 integration/ 因此爆过两次）。
        shell: bash
        env:
          # 走 env 而不是把 ${{ matrix.shard }} 直接插进脚本正文：
          # GH Actions 会先把 ${{ }} 展开成**脚本文本**再交给 bash 解析，
          # 将来矩阵若改成动态来源（fromJSON(needs...)），插值就成了注入面。
          SHARD: ${{ matrix.shard }}
        run: |
          # ⚠️ 用命令替换而不是进程替换：进程替换的退出码会被 mapfile 吞掉
          # （mapfile 恒返回 0），分片生成器一失败就变成「空数组」。
          # 空数组喂给 pytest = 「不带任何路径参数」⇒ pytest 回落到
          # testpaths=["app/tests"] ⇒ **整个 unit+integration+e2e 套件被收进来**
          # ⇒ 本 job 没有 neo4j/milvus 服务 ⇒ 报错并超时 ⇒ job 变 cancelled
          # ⇒ 失败集合为空 ⇒ 又一次假「净新增 0」。
          # 完成标记里的分片号必须是**已校验的数值**：
          # `SHARD` 来自 matrix，而 workflow 文件本身 PR 可改 ⇒ `SHARD` 可能是任意
          # 文本（含换行 ⇒ 可在日志里伪造一行完成标记）；而工具的标记正则是
          # `shard=(\d+)` ⇒ 非数字会让标记解析不出来（判「缺完成标记」⇒ 不可用，
          # 虽然 fail-closed，但真实原因「分片号非法」在日志里却像「被取消」）。
          # ⇒ 未校验前一律用 0 占位，校验通过后才覆盖。
          shard_index=0
          fail_unit() {
            # ::error:: 的消息体必须转义 % / \r / \n（GH workflow 命令协议）：
            # 消息里若带这些字符会被协议吞掉或截断 ⇒ 日志里看不到真实原因。
            local msg=${1//'%'/'%25'}
            msg=${msg//$'\r'/'%0D'}
            msg=${msg//$'\n'/'%0A'}
            echo "::error::$msg"
            # 失败路径也打完成标记（status=4 = pytest 没正常跑起来）：
            # 工具把「有标记且 status∉{0,1}」与「无标记」都判为不可用，
            # 但**原因不同** —— 有标记 ⇒ 重跑就好；无标记 ⇒ 先解决超时/抢占。
            echo "UNIT_SHARD_DONE shard=$shard_index status=4"
            exit 4
          }
          # 分片号必须是十进制非负整数（上界 3 位数字：防御矩阵改成动态来源后的注入）：
          # `10#$SHARD` 强制十进制（否则 `08` 是八进制语法错误）。
          if ! [[ "$SHARD" =~ ^[0-9]{1,3}$ ]]; then
            fail_unit "SHARD 必须是不超过 3 位的非负整数（实际：$SHARD）"
          fi
          shard_index=$((10#$SHARD))
          shard_list=$(uv run python -m app.utils.ci_shard \
            --root app/tests/unit --shards 4 --shard "$shard_index") || {
            fail_unit "分片清单生成失败（shard=$shard_index）"
          }
          if [ -z "$shard_list" ]; then
            fail_unit "shard=$shard_index 分到 0 个测试文件 —— 拒绝执行 pytest（空参数会让 pytest 收集整个 app/tests 树）"
          fi
          mapfile -t shard_tests <<< "$shard_list"
          printf 'Shard %s: %d test files\n' "$shard_index" "${#shard_tests[@]}"
          # pytest 失败也要走完下面的标记：`|| status=$?` 在 `set -e` 下不会触发 errexit。
          status=0
          uv run pytest "${shard_tests[@]}" -q -p no:randomly || status=$?
          # 完成标记：**日志里缺这个标记 ⇒ 该 job 是在跑完前被取消的**
          # ⇒ 它的失败集合是空的，不能参与「失败集合对差」，必须复跑该 job。
          # 标记里带 status：status=0 ⇒ 真绿；status!=0 ⇒ 真红（失败集合可用）。
          echo "UNIT_SHARD_DONE shard=$shard_index status=$status"
          exit "$status"

  backend-integration:
    name: Backend / integration shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # 实测最坏分片 49 分 48 秒（shard 2）⇒ 60 分钟上限的余量只有 **1.21 倍**，
    # runner 抖动 12% 就判 cancelled；而 **cancelled 的 job 失败集合是空的**
    # ⇒ 「失败集合对差」会得出「净新增 0」的**假结论**。
    # ⇒ 上限提到 90 分钟（余量 ~1.8 倍），与 unit 分片（40 分钟 / 余量 2.1 倍）同一量级。
    timeout-minutes: 90
    strategy:
      # 必须 fail-fast: false：一个分片失败若取消其余分片，被取消分片的失败集合
      # 同样是空的 ⇒ 又一次假「净新增 0」。
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qa_metadata_test
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_metadata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.23-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-only
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7688:7687
        options: >-
          --health-cmd "wget -O /dev/null -q http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      TEST_DATABASE_URL: postgresql+asyncpg://qa_user:ci-postgres-only@127.0.0.1:5434/qa_metadata_test
      TEST_NEO4J_URI: bolt://127.0.0.1:7688
      NEO4J_PASSWORD: ci-neo4j-only
      MILVUS_URI: http://127.0.0.1:19530
      MILVUS_TEST_DB_NAME: qa_ci
      MINIO_ROOT_USER: ci-minio-only
      MINIO_ROOT_PASSWORD: ci-minio-password-only
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Milvus
        # 覆盖 job 级 working-directory: backend —— compose 文件在仓库根 docker/ 下。
        # minio/minio 的 Docker Hub 官方镜像已下架（MinIO 2025 年中迁出，dockerproxy
        # 等镜像代理也无此 tag 缓存）——CI 改从 ghcr.io/sunql/qa-ci-minio（本仓库
        # 自托管、public，digest=sha256:b36662dc5313，与原 Docker Hub amd64 镜像
        # 逐字节同源）预拉，再 retag 成 compose 期望的 minio/minio 名字；prod compose
        # 文件因此零改动。其余两镜像按 tag 直接预拉；任何一步失败完整暴露报错，
        # 不做掩盖。
        working-directory: .
        run: |
          docker pull ghcr.io/sunql/qa-ci-minio:RELEASE.2023-03-20T20-16-18Z
          docker tag ghcr.io/sunql/qa-ci-minio:RELEASE.2023-03-20T20-16-18Z \
            minio/minio:RELEASE.2023-03-20T20-16-18Z
          for img in \
            quay.io/coreos/etcd:v3.5.5 \
            milvusdb/milvus:v2.4.6; do
            ok=""
            for i in 1 2 3 4; do
              if docker pull "$img"; then ok=1; break; fi
              echo "pull $img 第 $i 次失败，30s 后重试"
              sleep 30
            done
            if [ -z "$ok" ]; then
              echo "::error::docker pull $img 重试 4 次仍失败（限流或 tag 已被上游清理）"
              exit 1
            fi
          done
          docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 240 milvus-standalone
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Run integration shard
        # ⚠️ 本 job 的分片归属仍是「排序后下标 mod 4」（**刻意不改**）：
        # integration/ 确实有跨文件副作用（Milvus `qa_ci` 库惰性创建、Neo4j 残留
        # Class 节点），换哈希分片会移动 241/314 个文件的归属 ⇒ 必须先根治那些副作用。
        # 详见 Harness/changes/fix-ci-integration-hardening/summary.md。
        shell: bash
        env:
          # 走 env 而不是把 ${{ matrix.shard }} 插进脚本正文：
          # GH Actions 会先把 ${{ }} 展开成**脚本文本**再交给 bash 解析，
          # 将来矩阵若改成动态来源（fromJSON(needs...)），插值就成了注入面。
          SHARD: ${{ matrix.shard }}
          # 分片总数：**必须与上面 matrix.shard 的长度一致**。
          # 守卫：backend/app/tests/unit/test_ci_integration_step.py 断言两者一致
          # —— 不一致 ⇒ 要么有分片永远轮不到，要么下标越界切出空分片
          # ⇒ 空分片 ⇒ pytest 回落到 testpaths 收全树 ⇒ 假绿。
          SHARD_COUNT: "4"
        run: |
          # ---- 统一的失败出口：先打印完成标记，再退出 ----
          # status=4 与 pytest 自己的「用法错误」退出码同义：**pytest 没能正常跑起来**。
          # 为什么失败路径也要打标记：工具把「有标记且 status∉{0,1}」判为**不可用**
          # （必须复跑），把「无标记」也判为不可用（被取消）—— 两者都要复跑，
          # 但**原因不同**：前者重跑就好，后者要先解决超时/抢占。
          # ⇒ 标记让这两种情况在日志里可区分（而不是都退化成一句「没跑完」）。
          # 完成标记里的分片号必须是**已校验的数值**（与 unit 侧同理）：
          # `SHARD` 来自 matrix，而 workflow 文件本身 PR 可改 ⇒ `SHARD` 可能是任意
          # 文本（含换行 ⇒ 可在日志里伪造一行完成标记）；而工具的标记正则是
          # `shard=(\d+)` ⇒ 非数字会让标记解析不出来（判「缺完成标记」⇒ 不可用，
          # 虽然 fail-closed，但真实原因「分片号非法」在日志里却像「被取消」）。
          # ⇒ 未校验前一律用 0 占位，校验通过后才覆盖。
          shard_index=0
          fail_shard() {
            # ::error:: 的消息体必须转义 % / \r / \n（GH workflow 命令协议）：
            # 消息里若带这些字符会被协议吞掉或截断 ⇒ 日志里看不到真实原因；
            # $1 可能插值进来路不明的文本（文件名等）⇒ 不能不转义。
            local msg=${1//'%'/'%25'}
            msg=${msg//$'\r'/'%0D'}
            msg=${msg//$'\n'/'%0A'}
            echo "::error::$msg"
            echo "INTEGRATION_SHARD_DONE shard=$shard_index status=4"
            exit 4
          }

          # ---- 分片号必须是十进制非负整数 ----
          # ${{ matrix.shard }} 现在是安全的（走 env，不进脚本文本），但一旦有人
          # 改成动态来源，非数字就会让下面的算术展开炸掉；上界 3 位数字防注入；
          # `10#$SHARD` 强制十进制（否则 `08` 会被当成八进制语法错误）。
          if ! [[ "$SHARD" =~ ^[0-9]{1,3}$ ]]; then
            fail_shard "SHARD 必须是不超过 3 位的非负整数（实际：$SHARD）"
          fi
          shard_index=$((10#$SHARD))
          if ! [[ "$SHARD_COUNT" =~ ^[0-9]{1,3}$ ]] || [ "$SHARD_COUNT" -lt 1 ]; then
            fail_shard "SHARD_COUNT 必须是不超过 3 位的正整数（实际：$SHARD_COUNT）"
          fi
          if [ "$shard_index" -ge "$SHARD_COUNT" ]; then
            fail_shard "shard=$shard_index 超出分片总数 $SHARD_COUNT"
          fi

          # ---- 清单生成：NUL 分隔 + 退出码可捕获 ----
          # ⚠️ 不用换行分隔：文件名里若含换行/空格，mapfile 会把它拆开
          # ⇒ 静默丢文件（或多出假文件）⇒ 分片内容与预期不符。
          # ⚠️ 不用命令替换：**命令替换会剥掉 NUL 字节** ⇒ 拿不到 NUL 分隔的列表；
          # 也**不用进程替换**：进程替换的退出码会被 mapfile 吞掉（mapfile 恒返回 0）。
          # ⇒ 落临时文件：find 的失败经 **pipefail** 传播到管道退出码
          # （GH Actions 的 `shell: bash` 默认带 `-e -o pipefail`）。
          # ⚠️ mktemp 失败也必须走 fail_shard：裸 `list_file=$(mktemp)` 在 set -e 下
          # 会让脚本**直接退出而不打标记** ⇒ 工具判「无标记 = 被取消」⇒ 原因失真。
          list_file=$(mktemp) || fail_shard "创建临时清单文件失败（mktemp）"
          find app/tests/integration -name 'test_*.py' -print0 | sort -z > "$list_file" || {
            rm -f "$list_file"
            fail_shard "integration 测试文件清单生成失败"
          }
          if [ ! -s "$list_file" ]; then
            rm -f "$list_file"
            fail_shard "未找到任何 integration 测试文件"
          fi
          mapfile -d '' -t all_test_files < "$list_file"
          rm -f "$list_file"

          # ---- 分片切分：下标 mod SHARD_COUNT ----
          shard_tests=()
          for ((i=shard_index; i<${#all_test_files[@]}; i+=SHARD_COUNT)); do
            shard_tests+=("${all_test_files[$i]}")
          done
          # ⚠️ 空分片必须硬失败：空数组喂给 pytest = 「不带任何路径参数」
          # ⇒ pytest 回落到 testpaths=["app/tests"]
          # ⇒ **整个 unit+integration+e2e 套件被收进来** ⇒ 本 job 没有 unit 那套环境
          # ⇒ 报错并超时 ⇒ job 变 cancelled ⇒ 失败集合为空 ⇒ 又一次假「净新增 0」。
          if [ "${#shard_tests[@]}" -eq 0 ]; then
            fail_shard "shard=$shard_index 分到 0 个测试文件 —— 拒绝执行 pytest（空参数会让 pytest 收集整个 app/tests 树）"
          fi
          printf 'Shard %s: %d test files\n' "$shard_index" "${#shard_tests[@]}"
          # pytest 失败也要走完下面的标记：`|| status=$?` 在 `set -e` 下不会触发 errexit。
          status=0
          uv run pytest "${shard_tests[@]}" -q -p no:randomly || status=$?
          # 完成标记：**日志里缺这个标记 ⇒ 该 job 是在跑完前被取消的**
          # ⇒ 它的失败集合是空的，不能参与「失败集合对差」，必须复跑该 job。
          # 标记里带 status：status=0 ⇒ 真绿；status=1 ⇒ 真红（失败集合可用）；
          # status∉{0,1} ⇒ pytest 没跑完 ⇒ 同样不可用（工具判「必须复跑」）。
          echo "INTEGRATION_SHARD_DONE shard=$shard_index status=$status"
          exit "$status"
