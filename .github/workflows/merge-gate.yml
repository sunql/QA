# CI 合并判据的强制闸门（判据全文见 Harness/rules/测试规范.md「CI 合并判据」）。
# 在 CI workflow 完成后自动跑「失败集合对差」工具，把结论落成 check run；
# main 分支保护把 check `merge-gate / failure-set-diff` 设为必需
# ⇒ 净新增失败非 0 / 存在不可用 job 的 PR 无法合并。
#
# 安全性质（威胁模型见测试规范）：
# - workflow_run 语义保证本文件与工具代码**始终取自默认分支** ⇒ PR 无法篡改闸门本身；
# - 故意**不传 --allow-ci-changes**：PR 改了 CI 相关面 ⇒ 退出码 6 ⇒ failure。
#   人工仲裁确认「分片归属未变」后，由 bypass 账号显式合并（solo 仓库的显式越权口）；
# - 退出码 5（净丢失待人工确认）同样判 failure，人工确认后同上。
# - 基线取法（2026-11-05 定死、2026-11-07 N6 修订、2026-11-07 CRITICAL-1 再修订）：
#   **同一完成标记协议下**，**在 PR 的 CI 事件派发之前** main 上最新完成的 run
#   （`branch=main`、`event=push`、`status=completed`）；更早协议的 run 会拒判 UNUSABLE_JOBS。
#   ⚠️ 为什么要加「PR 事件派发之前」：PR 的 CI 跑的是 `refs/pull/N/merge`
#     （= main 与 PR 头合并出来的 commit）⇒ 它执行的是**PR 事件派发那一刻的 main**
#     （合并 commit 在派发时就被冻结 ⇒ 复跑不会重新计算它 ⇒ 复跑检出的仍是同一个）。
#     基线若取了之后才推的 main ⇒ 两次 run 跑的代码天然不同 ⇒ **系统性假拦**
#     （实测 PR #92/#94/#95/#107 的净变更 CI 命中 1/29/29/17，真归因命中 **0**）。
name: merge-gate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read

concurrency:
  group: merge-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  failure-set-diff:
    # 不设 job 级 name:：job 自带的 check 会与下面 API 创建的
    # `merge-gate / failure-set-diff` 同名，必需检查按名字匹配时撞最新的一个是竞态。
    # API 创建的 check 是该名字的唯一来源。
    # 只对「CI 的 pull_request run」出裁决；main 的 push run 是未来的基线，不裁决。
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # 收敛等待最长 30 分钟 + 工具跑 ~5 分钟
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ 必须**显式**指向默认分支。
          # `workflow_run` 语义下 `github.sha` / `github.ref` 本来就指向默认分支
          # ⇒ 默认检出的就是 main 的版本；但那是 action 的**隐含默认**。
          # 这里写出来 = 契约 ⇒ 「已知抖动白名单只认 main 上的版本」
          # ⇒ **PR 不能给自己开豁免**。
          # 守卫：`backend/app/tests/unit/test_ci_merge_gate_workflow.py`
          #   ::test_checkout_targets_the_default_branch_explicitly
          ref: ${{ github.event.repository.default_branch }}

      - name: Wait for job-level conclusions to converge (API eventual consistency)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # 实测（2026-11-04/05）：run 级已 completed 后，job 列表的 conclusion 仍为 null
          # 长达 13-18 分钟 ⇒ 工具会把它们判成 UNUSABLE_JOBS。
          # 收敛前不裁决；30 分钟仍不收敛就放行给工具（fail-closed：照样判 UNUSABLE）。
          # 注意：本步骤在 GitHub 默认 shell `bash -e` 下运行 ⇒ 对 gh api 的每次调用
          # 都要 `|| 兜底`，单次网络抖动不得杀掉整个等待循环。
          for i in $(seq 1 30); do
            NULLS="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PR_RUN_ID}/jobs?per_page=20" \
              --jq '[.jobs[] | select(.conclusion == null)] | length')" || NULLS=1
            echo "attempt ${i}: null_conclusion_jobs=${NULLS}"
            [ "${NULLS}" = "0" ] && exit 0
            sleep 60
          done
          echo "job conclusion 30 分钟未收敛 ⇒ 交给工具判 UNUSABLE_JOBS（fail-closed）"
          exit 0

      - name: Run failure-set diff and report the required check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          # 本步骤在 GitHub 默认 shell `bash -e` 下运行。**第一条铁律**：
          # 凡「预期可能失败」的命令一律 `|| 兜底` —— 直接写
          # `report="$(可能失败的命令)"` 会在命令替换非零时被 -e 当场杀掉整步，
          # 导致 check 不落库、退出码还不对（2026-11-05 gate 首跑实证：
          # 工具判 UNUSABLE 退出码 2，但 -e 在赋值处就把步骤杀了，
          # 既没有 check 也没有任何输出 ⇒ 闸门对所有 PR 死锁）。
          set -uo pipefail
          CHECK_NAME="merge-gate / failure-set-diff"

          # 基线：main 上**在 PR 的 CI 事件派发之前**最新完成的 push run（同完成标记协议）。
          #
          # ⚠️ 2026-11-07 N6：**为什么不能取「闸门跑的那一刻 main 上最新的 run」**：
          # PR 的 CI 跑的是 `refs/pull/N/merge`（main 与 PR 头合并出来的 commit）
          # ⇒ 它执行的是**PR 事件派发那一刻的 main**。
          # 若基线取了**之后**才推的 main ⇒ 基线树含 main 的后续改动（尤其是 CI 文件）
          # ⇒ 而 PR run 的树不含 ⇒ 「两次 run 跑的代码不同」被放大
          # ⇒ **系统性假拦**（实测 PR #92/#94/#95/#107 的净变更 CI 命中 1/29/29/17，
          #   而它们真正的三点归因命中是 **0**）。
          # ⇒ 基线必须取「PR 事件派发**之前**」的 main。
          #
          # ⚠️ 2026-11-07 代码评审 CRITICAL-1：时间上界用 **`created_at`**（事件派发时刻），
          # **不是** `run_started_at` ——
          # `pull_request` 事件的**合并 commit 在事件派发那一刻就被冻结**了
          # ⇒ 复跑（re-run）**不会**重新计算它 ⇒ 复跑检出的仍是**同一个**合并 commit
          # ⇒ 它的 main 侧底座是**派发那一刻**的 main。
          # 实测（PR #105 run `41908498247`，attempt=2）：`created_at=2026-11-04T20:38:19Z`、
          # `run_started_at=2026-11-04T22:24:11Z`；合并 commit `57a267a9` 的
          # committer.date = `20:38:18Z`、第一父 = `83581e10`；attempt-2 的 job 日志写着
          # `git fetch … +57a267a93f…:refs/remotes/pull/105/merge` ⇒ **同一个**合并 commit。
          # ⇒ 用 `run_started_at` ⇒ 基线取到**派发之后**的 main ⇒ 基线树 ≠ 执行树
          # ⇒ 两次 run 实际跑的 CI 定义不同却判「可合并」⇒ **fail-open**。
          # ⇒ 工具侧（`ci_gh.mainTipCutoff`）用**同一个**锚点 ⇒ 两边必须一致。
          #
          # 跳过 conclusion=cancelled 的 run：ci.yml 的 cancel-in-progress 会在新 main push
          # 时取消上一轮 ⇒ 被取消的 run 的 job 没有完成标记 ⇒ 拿它当基线必判 UNUSABLE，
          # main 刚推送后的窗口期内会误拦所有 PR（2026-11-05 run 41882361045 实证）。
          #
          # ⚠️ 2026-11-07 安全评审 HIGH-1：**必须限定 event=push**。
          # GitHub 的 `runs?branch=<name>` 过滤匹配的是 `head_branch`、**不区分事件**
          # （实测：`branch=feat/merge-gate-flake-whitelist` 返回的是
          # `event=pull_request` 的 run）⇒ 一个**名叫 main 的 fork 分支**发起的 PR
          # 也会命中 `branch=main` ⇒ 它的 run 可能被当成「main 的基线」
          # ⇒ 基线 = 攻击者自己的代码 ⇒ 失败集合对差被中和。
          # ⇒ 查询串加 `event=push` + jq 再筛一次 `.event == "push"`（双保险：
          #   工具侧还会独立复核一遍，见 ci_surface._baseTrustError）。
          #
          # ⚠️ 时间戳比较：GitHub 的 `created_at` 形如 `2026-11-07T01:23:45Z`
          # ⇒ 同格式的 ISO8601 字符串**字典序 == 时序** ⇒ jq 里可直接 `<=`。
          # ⚠️ 用**独立的 jq 二进制**（而不是 `gh --jq`）⇒ 时间窗能通过 `--arg`
          #   传进去（`gh --jq` 不支持 `--arg`）⇒ 不用把时间戳拼进 jq 程序
          #   （拼进去 = 引号地狱 + 时间戳含特殊字符时的注入面）。
          # ⚠️ `jq` 是 ubuntu-latest 的预装工具；万一缺失 ⇒ 判不出来 ⇒ fail-closed。
          # ⚠️ 返回的 run 列表按 `created_at` **倒序** ⇒ 过滤后取 `[0]`
          #   = 「不晚于 PR 事件派发的最新一次 main push run」。
          # ⚠️ `--paginate --slurp` 取**全部**页：PR 可能比较旧 ⇒ 目标基线
          #   可能在第一页之外 ⇒ 只取一页会漏 ⇒ 过滤后为空 ⇒ 误判「没有基线」。
          BASE_RUN_ID=""
          if [ -z "${PR_RUN_CREATED_AT}" ]; then
            # 拿不到 PR run 的事件派发时间 ⇒ 算不出「派发之前」⇒ 判不出基线 ⇒ fail-closed。
            # ⚠️ 空字符串会让 jq 的 `.created_at <= ""` **恒真**
            # ⇒ 基线退化成「main 上最新的 run」⇒ 又变回系统性假拦。
            echo "PR_RUN_CREATED_AT 为空 ⇒ 无法限定基线时间窗（fail-closed）"
          elif command -v jq >/dev/null 2>&1; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
              --paginate --slurp > /tmp/main_push_runs.json || echo "[]" > /tmp/main_push_runs.json
            # ⚠️ 2026-11-07 安全评审 MEDIUM-3 / 代码评审 LOW-3：jq 侧**独立复核**
            #   `head_branch` / `head_repository` / `status`（不能只靠查询串）：
            #   `runs?branch=main` 匹配的是 `head_branch`、**不区分事件**
            #   ⇒ 一个**名叫 main 的 fork 分支**也会命中 ⇒ 基线可能变成攻击者自己的代码。
            #   ⇒ 仓库名比较用**大小写不敏感**（GitHub 的仓库名大小写不敏感，
            #   实测 API 侧会原样返回 `Sunql/QA` 这类形态 ⇒ 严格相等会把**合法基线**
            #   判成不可信 ⇒ 闸门对所有 PR 死锁）。
            BASE_RUN_ID="$(jq -r --arg cutoff "${PR_RUN_CREATED_AT}" --arg repo "${GITHUB_REPOSITORY}" \
              '[.[] | .workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed" and .conclusion != "cancelled" and ((.head_repository.full_name // "") | ascii_downcase) == ($repo | ascii_downcase) and .created_at <= $cutoff)][0].id // empty' \
              /tmp/main_push_runs.json)" || BASE_RUN_ID=""
          fi
          if [ -z "${BASE_RUN_ID}" ]; then
            # ⚠️ 用 printf 的**格式串**而不是把时间戳拼进双引号字符串（引号/反斜杠
            #   一旦出现在值里就会破坏字符串边界）⇒ 报告文本不会因为取值而变形。
            report="$(printf '找不到在 PR CI 事件派发（%s）之前完成的 main CI run ⇒ 无基线可比（fail-closed）。等 main 的 push run 完成后再试。' "${PR_RUN_CREATED_AT}")"
            code=3
          else
            code=0
            report="$(cd backend && python3 -m app.utils.ci_failure_set \
              --repo "${GITHUB_REPOSITORY}" \
              --base-run "${BASE_RUN_ID}" --pr-run "${PR_RUN_ID}" \
              --gate-title-file /tmp/gate_title.txt 2>&1)" || code=$?
          fi
          echo "tool_exit_code=${code}"

          case "${code}" in
            0) conclusion="success"; title="净新增 0 ⇒ 可合并" ;;
            *) conclusion="failure"; title="退出码 ${code} ⇒ 不可合并（净新增 / 不可用 job / 待人工确认）" ;;
          esac

          # ⚠️ **已知抖动豁免必须出现在标题里**（对称豁免的代价：PR 侧确定性弄红
          # 白名单用例也不拦 ⇒ 唯一的提示若只躺在 summary 正文里，GitHub UI 上
          # 人先看到的仍是「绿色对勾 + 净新增 0 ⇒ 可合并」⇒ 真相被盖住）。
          #
          # ⚠️ 2026-11-06 安全评审 L-2：标题必须走**独立文件**（`--gate-title-file`），
          # 不能从人读的报告正文里 grep —— 报告是给人读的文本 ⇒ 改一下渲染
          # （加缩进、换前缀、把标题挪到会被截断的尾部）就静默失效
          # ⇒ 豁免提示从标题里消失 ⇒ **真相被盖住**且无人察觉。
          # 工具没写这个文件（退出码非 0 / 没豁免）⇒ 沿用上面的标题。
          TOOL_TITLE=""
          if [ -f /tmp/gate_title.txt ]; then
            TOOL_TITLE="$(cat /tmp/gate_title.txt || true)"
          fi
          if [ -n "${TOOL_TITLE}" ]; then
            title="${TOOL_TITLE}"
            echo "gate_title=${TOOL_TITLE}"
          fi

          # check-run 摘要的字节窗口（报告以「结论」行开头，必须保留头部）。
          # ⚠️ 窗口必须**大于**工具自己的报告上限（`ci_report.MAX_REPORT_BYTES` = 20000）：
          # 截断必须由工具负责（它会明示「报告已截断」并把提示放在头部），
          # workflow 只搬运 ⇒ 否则 workflow 按字节二次砍尾 ⇒ **静默**丢掉证据
          # （2026-11-06 代码评审 M-1 实测：净新增失败清单被整段挤出摘要）。
          # 守卫：`backend/app/tests/unit/test_ci_merge_gate_workflow.py`
          #   ::test_merge_gate_summary_window_is_wider_than_the_report_cap
          # `|| true` 压住两处 -e/pipefail 雷：报告超窗口字节时 printf 收 SIGPIPE
          # （退出码 141）会被 pipefail 判失败 ⇒ 又被 -e 杀掉整步（同上，check 不落库）。
          printf '%s' "${report}" | head -c 30000 > /tmp/gate_report.txt || true
          jq -n \
            --arg name "${CHECK_NAME}" \
            --arg sha "${HEAD_SHA}" \
            --arg conclusion "${conclusion}" \
            --arg title "${title}" \
            --rawfile text /tmp/gate_report.txt \
            '{name: $name, head_sha: $sha, status: "completed", conclusion: $conclusion,
              output: {title: $title, summary: $text}}' > /tmp/gate_payload.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input /tmp/gate_payload.json \
            --jq '{name, conclusion, html_url}'

          # check 已落库；工作流的红绿跟随工具结论，便于一眼看到闸门状态
          exit "${code}"
