name: qa-system

services:
  # ===== 关系型元数据库 =====
  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_metadata
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"  # 避开宿主 5432（被 openmetadata 占用）；容器内仍是 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_metadata"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 本体图数据库 =====
  neo4j:
    image: neo4j:5.23-community
    container_name: qa-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ===== Milvus 向量库依赖 =====
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: qa-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: qa-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.4.6
    container_name: qa-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # metrics
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===== Demo 业务库（WMS） =====
  mysql-demo:
    image: mysql:8.0
    container_name: qa-mysql-demo
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wms_demo
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== FastAPI 后端 =====
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: qa-backend
    restart: unless-stopped
    # 容器内配置全部从 docker/.env 注入（SSOT：容器内端口用容器 service 名 + 容器端口）。
    # 本地 dev（容器外跑 uvicorn）用 backend/.env，端口用 localhost:5433（因宿主端口重映射）。
    # 端口契约详见 Harness/wiki/operations-runbook.md「SSOT 端口契约」段。
    env_file:
      - .env
    extra_hosts:
      # 容器内访问宿主机（host.docker.internal）；Linux Docker 需显式 host-gateway，
      # macOS/Windows Docker Desktop 自动解析，此映射兼容两者。
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy

  # ===== React 前端 =====
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: qa-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
  neo4j_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  mysql_data:
