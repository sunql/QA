server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小上限：覆盖 nginx 默认 1m（详见 https://nginx.org/en/docs/http/ngx_http_core_module.html#client_max_body_size）
    # 文档中心 RAG 上传（PDF/DOCX/TXT/MD）典型 1-20MB，100m 留 5x 余量；
    # 大文件走流式（proxy_buffering off）避免 100m 一次性占内存。
    client_max_body_size 100m;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（可选，生产可让前端直连后端）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传流式转发（避免 nginx 把整个 body 缓存到磁盘再转给后端）
        proxy_buffering off;
        proxy_request_buffering off;
        # 大文件解析耗时较长，放宽代理超时（默认 60s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
